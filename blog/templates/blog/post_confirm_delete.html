
{% extends "blog/base.html" %}
{% block title %}Delete Post{% endblock %}
{% block content %}
<h1>Delete Post</h1>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post"> {% csrf_token %}<button type="submit" class="btn btn-danger">
  Yes, Delete </button>
 <a href="{% url 'post_detail' slug=object.slug %}">
        Cancel
</a>
</form>
{% endblock %}
